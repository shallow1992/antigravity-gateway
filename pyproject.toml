[project]
name = "antigravity-gateway"
version = "0.1.0"
description = "Google Antigravity Slack Gateway (Remote Control)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "google-antigravity>=0.1.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
